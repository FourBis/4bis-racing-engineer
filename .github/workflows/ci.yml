name: CI

on:
  pull_request:
    branches: [develop, main, master]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    if: github.event_name != 'pull_request' || github.event.pull_request.user.id == 66529405
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.15'
      - name: Tests sin SDK ni datos privados
        run: python -X utf8 check.py
      - name: Regresión del dashboard
        run: node --test tests/dashboard.test.cjs
      - name: Demo sintetica
        run: python -X utf8 run.py demo --headless --report reports/demo
